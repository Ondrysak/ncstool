# NCS format offsets — derived from Novation's validator WASM.
# File is fixed-size 160780 bytes (0x2740C); whole file validated in place, so
# validator read-offset == file offset.
#
# TWO confidence tiers, kept strictly separate:
#   [verified.*]  = read from the decompiled validator in THIS analysis AND
#                   confirmed against test_data/Deep.ncs + Funk.ncs using the
#                   validator's own range constraints (empirically falsifiable).
#   [inferred.*]  = taken from the existing ncs_tool/main.rs offsets (consistent
#                   with samples) but NOT re-derived from the validator here.
#   [pending.*]   = validator function known, offsets not yet extracted.

file_size = 160780

# ============================ VERIFIED ============================

[verified.header]        # validator f_tu
signature = 0x00         # accepts "USER" or "DEMO"
file_size = 0x04         # u32 must equal 160780
feature_flags = 0x08     # u32 must equal 1 (midiTracks bit set; reserved clear)
session_colour = 0x0C    # u8 range 0..13; followed by padded display-name bytes at 0x10

[verified.timing]        # validator f_ku: reads a[0x34]; (tempo-40)&255<=200
tempo = 0x34             # range 40..240  (VERIFIED read + range)

[verified.synth_patterns]  # validator f_qt
# Absolute formula (NO separate base term — matches validator exactly):
#   step_base = track*25920 + pattern*3240 + step*28   (synth block base already folded in)
# All field offsets below are absolute = step_base + <const>.
track_stride   = 25920   # 0x6540   (2 tracks)
pattern_stride = 3240    # 0xCA8    (8 patterns)
step_stride    = 28      # 0x1C     (32 steps)
notes_per_step = 6
# stepInfo (CORRECTED: +740 is the note mask, +741 the probability):
stepinfo_note_mask   = 740   # step_base+740 (0x2E4), range 0..63; bit N => note slot N present
                             #   (VERIFIED 512/512: mask bit-count == present-note count)
stepinfo_probability = 741   # step_base+741, range 0..7  (VERIFIED 512/512)
# per-note sub-record: 4 bytes, stride 4, note N absolute = step_base + 744 + N*4:
note_number    = 744     # +0; 0=empty else 1..139
note_gate      = 745     # +1, VERIFIED 0..127 on active notes
note_delay     = 746     # +2
note_velocity  = 747     # +3, VERIFIED 0..127 on active notes
# NOTE: 740 == 0x2E4. "synth block at 0x2E4" and "stepInfo at +740" are the SAME
# fact — never add them together.

[verified.midi_patterns]  # validator f_ep — IDENTICAL shape to synth, relocated
# step_base = MIDI_BASE + track*25920 + pattern*3240 + step*28
midi_base      = 0x1A27C  # 107132; block ends 0x26CFC, just before scale @0x26D0C
track_stride   = 25920
pattern_stride = 3240
step_stride    = 28
notes_per_step = 6
stepinfo_note_mask   = 0   # MIDI_BASE-relative +0, range 0..63  (VERIFIED 512/512 both files)
stepinfo_probability = 1   # +1, range 0..7                       (VERIFIED 512/512)
note_number = 4            # +4 + N*4, then +1 gate / +2 delay / +3 velocity (same as synth)

[verified.melodic_pattern_tail]  # synth (f_kt/f_ft/f_xs/f_ms) AND midi — same layout
# Per-pattern, offsets relative to the pattern's stepInfo start (step 0).
# Steps occupy +0..+895 (32*28); tail follows:
playback_start     = 896  # +896, range 0..31  (f_kt reads +896 and +897)
playback_end       = 897  # +897, range 0..31
sync_rate          = 898  # +898, range 0..7   (f_ft)
playback_direction = 899  # +899, range 0..3   (f_xs)
unknown_gap        = 900  # +900..+935 (36 bytes) — NO validator, carried raw
automation_base    = 936  # +936; f_ms: 12 lanes x 192 = 2304, ends at +3239
automation_lanes   = 12   # NB: melodic = 12 lanes (drums = 8)
automation_lane_len = 192 # allowlist-checked, not a simple range
# closure: 896 + 2 + 1 + 1 + 36 + 12*192 = 3240 == pattern_stride

[verified.drum_patterns]   # validator f_vr: base+track*13632+pattern*1704+step, plane @+52596
velocity     = 0xCD74    # range 0..127
probability  = 0xCD94    # checked on played hits only: 0..7
drum_choice  = 0xCDB4    # allowlist {0..63,255}; 255 = use track default choice
drum_rhythm  = 0xCDD4    # nonzero iff velocity is nonzero; allowlist {0..127,255}
track_stride = 0x3540
pattern_stride = 0x6A8   # 4 tracks x 8 patterns x 32 steps
[verified.drum_pattern_tail]  # per-pattern, offsets relative to velocity plane base (0xCD74)
# validators f_nr/f_dr/f_uq/f_lq — per-pattern (track x pattern loops, no step loop)
playback_start     = 128  # +128 (0xCDF4), range 0..31  (f_nr reads +128 and +129)
playback_end       = 129  # +129, range 0..31
sync_rate          = 130  # +130, range 0..7            (f_dr)
playback_direction = 131  # +131, range 0..3            (f_uq)
unknown_gap        = 132  # +132..+167 (36 bytes) — NO validator, carried raw
automation_base    = 168  # +168; f_lq: 8 lanes x 192 bytes = 1536, ends at +1703
automation_lane_len = 192 # allowlist {0..127,255}; 255 = unset/no automation
# NOTE: this supersedes main.rs's old pitch/decay/distortion/eq "planes" at
# +128/+160/+192/+224 — those were NOT step planes; they overlap this tail.

[verified.scale]         # validator f_tn
root = 0x26D0C           # range 0..11
scale_type = 0x26D0D     # range 0..15

[verified.fx]            # validator f_ln
delay_preset = 0x26D0E   # range 0..15
reverb_preset = 0x26D0F  # range 0..7

[verified.track_info]    # validators f_ds / f_yn
synth_base = 0xCD64      # 2 records, stride 8; patch 0..127, mute 0..1, sidechain 0..7
midi_base = 0x26CFC      # 2 records, stride 8; patch 0..7, mute 0..1, sidechain 0..7
record_stride = 8

[verified.drum_state]    # validators f_aq / f_pp
drum_mute_states = 0x1A274      # 4 bytes, range 0..1
default_drum_choices = 0x1A278  # 4 bytes, range 0..64

[verified.midi_keyboard_octaves]  # validator f_cn
base = 0x26D10            # 2 bytes, range 58..69

[verified.scenes]        # validator f_hu — VERIFIED 128/128 on both samples
base = 0x40              # 16 scenes x 8 pattern-chain entries {start,end<=7,pad==0}
scene_stride = 0x28      # = 8*4 entries + 8 pad bytes
entry_stride = 4
count = 16 ; entries_per = 8

[verified.chains]        # validators f_cu (scene_chain) / f_wt (pattern_chains)
scene_chain_base   = 0x2C0  # {start,end scene idx 0..15, pad==0}
pattern_chain_base = 0x2C4  # 8 entries {start,end<=7, pad==0}
pattern_chain_stride = 4
pattern_chain_count  = 8

# ======================== INFERRED (sample-consistent) ========================

[inferred.timing]
swing      = 0x35        # range 20..80  (validator strings exist; range not re-derived here)
swing_sync = 0x36        # range 0..7
spare1     = 0x38        # u32 must be 0
spare2     = 0x3C        # u32 must be 0
# Remaining work: header display-name semantics, feature-flag/sessionColour naming
# reconciliation, and the unvalidated 36-byte per-pattern gaps. All known validator
# functions are represented in ncs.ksy; conditional/cross-field rules live in
# Session::validate where Kaitai cannot express them cleanly.
#
# Extraction procedure (proven): read the validator fn -> get index formula + range check;
# then confirm the offset against Deep.ncs/Funk.ncs by requiring ALL elements satisfy the
# range (e.g. synth stepInfo gave 512/512). A wrong offset fails the range check.
